# r59 KW (-kw1): this tree = the base bundle + OUR component kda_wy32_route (KDA-WY32 + WY-ONORM target-verify kernel kda_wy32.py, served inside kda_v2_route's domain after a voted boot proof against stock's kernel; their path otherwise), added by r59/kw/apply_kw.py; every op, slot, source, entry and prepare unchanged.
# r59 EP (-ep): this tree = the base bundle + OUR component moe_ep_route (the TP4 decode engine's routed NVFP4 experts resharded once at a target MoE layer's prepare from TP (288 experts x intermediate 512 a rank) to expert-parallel inside the TP group (72 whole experts a rank, intermediate 2048), voted probe, all or nothing across layers; in place: NEEDS THE USER'S OK), added by r59/ep/apply_ep.py.
# r60 FP4C (-fp4c): this tree = the base bundle + OUR component fp4_cover_route (the king's dormant NVFP4 prefill groups switched on: G2a o_proj on the 7 AMAP-admitted DSA layers, G3 also on layers 1-2; LOSSY: audit + quality screen first), added by r60/fp4c/apply_fp4c.py.
# r60 FP4M (-fp4m): this tree = the base bundle + OUR component fp4_more_route (the king's dormant NVFP4 prefill groups G1 = shared expert (SKIP {3}) and G4 = q_b / kv_b on the 7 AMAP-admitted DSA layers switched on, on top of FP4C; LOSSY: audit + quality screen first), added by r60/fp4m/apply_fp4m.py.
# r60 IDX-ALT (-idxalt): this tree = the base bundle + OUR component idx_dgo6_route (the TP4 decode engine's target-verify DSA indexer logits, next_n 6, by OUR CuTe-DSL kernel DGO6 idx_dgo6.py (a modified Apache-2.0 SGLang file, header kept) instead of DeepGEMM legacy; BITWISE: voted boot proof, OFF on every rank on any miss; top-k stock), added by r60/idxalt/apply_idxalt.py.
# r60 RIDERS KTG (-ktg2): this tree = the base bundle + OUR component kda_track_route (KDA-TRACK-GLUE: the KDA prefix-track row copies and the conv-window snapshot as single Triton launches, bitwise with per-form voted proofs; prefill eager only), added by r60/riders/apply_ktg.py.
# r60 RIDERS ERP (-erp2): this tree = the base bundle + OUR component embed_repl_route (EMBED-REPL: a replicated TP2 embedding table for prefill eager calls of >= 8192 ids, no all-reduce, voted build + 2 voted bitwise checks) on the op model.embed_tokens (nodes.py forward_embed), added by r60/riders/apply_erp.py.
# r60 MQ-CUDA (-mqcuda): this tree = the base bundle + OUR component mq_cuda_route (the prefill MoE input NVFP4 quantize on FlashInfer's cuda backend where byte-equal and faster, gated at prepare; bitwise), added by r60/mqcuda/apply_mqcuda.py.
# r60 FP4-BENCH (-fp4bench): this tree = the base bundle + OUR diagnostic component fp4_bench_route (boot-time FP8 vs NVFP4 timing of the king's FP4 prefill groups; serves nothing), added by r60/fp4bench/apply_fp4bench.py.
# r60 KATTN-ONCE (-kattn1): this tree = the base bundle + OUR component kattn_once_route (one top-k selection a K' layer call: the king's dsa_kattn_route._select runs the K'=1024 selection only and hands stock's code the K' picks padded to stock's width; BITWISE, 2 voted kernel-table checks a path kind first and a voted re-check every 256 served calls of a kind, any miss -> OFF on every rank), added by r60/kattn1/apply_kattn1.py.
# r60 G4S27 (-g4s27): this tree = the base bundle with layer 27 added to OUR fp4_more_route's G4 skip set (G4 q_b / kv_b NVFP4 on 6 DSA layers 7, 11, 15, 31, 39, 43; FP4C's G2a o_proj on layer 27 kept; chk-KP32NkwEFMIk2 layer 27 worst 0.845), edited by r60/g4s27/apply_g4s27.py.
# r60 KATTN2 (-kset): this tree = the base bundle with OUR kattn_once_route replaced by its SET-EXACT form (r60/kattn2: rows compared as sets, -1 mask in place, lengths exact; the king's v2 top-k writes K' picks in no particular order, so -kattn1's byte checks went OFF on box11 042), by r60/kattn2/apply_kset.py.
# r60 G1OFF (-g1off): this tree = the base bundle with OUR fp4_more_route switching on only G4 (q_b / kv_b NVFP4, 6 DSA layers); G1 (the shared expert) stays on the king's FP8 copy: its NVFP4 gain is hidden by the king's shared-expert side stream (box11 FP4C -> FP4M cold = G4's share) while it adds W4A4 error; by r60/g1off/apply_g1off.py.
# r60 FINAR (-finar): this tree = the base bundle + OUR component finar_route (the TP4 decode engine's MoE exit at 480-768 rows: the king's A4 finalize + shared add computed in the push read of OUR two-shot all-reduce, finar_ar.cuh folded into the king's dsa_pagetable_native unit as its submodule finar; BITWISE: voted seeded boot proof vs A4 + stock 2shot_push, OFF on every rank on any miss), added by r60/finar/apply_finar.py.
# r61 PF-EP2 (-pfep): this tree = the base bundle + OUR pf_ep_route (prefill / audit TP2 routed experts resharded to expert-parallel inside TP2) + the king's moe_dsl_route with its EP literals opened, by r61/pfep/apply_pfep.py.
# r61 PF-EP2 PLAN (-pfepp): this tree = the base bundle with the EP2-measured CuTe-DSL MoE plans (16384 rows: 256-row tiles, clusters 2x1 / 2x2; 5120-16383 rows: FC2 rastered along N), bitwise to the king's plans, by r61/pfep/apply_pfepplan.py.
# r61 NaN-CONFINE (-fp4n): this tree = the base bundle + OUR fp4_amax_route (the king's dynamic NVFP4 activation amax confined to finite values per copy; byte-identical on finite inputs), by r61/nanc/apply_nanc.py.
# r61 PF-EP2 PLAN TABLE (-pfept): EP2 DSL plans [[16384,[[256,256],[2,1],[256,256],[2,2],256],false,true],[5120,[[128,256],[1,1],[128,192],[1,2],128],false,false],[4096,[[128,256],[1,1],[128,128],[1,1],128],true,true],[0,[[128,128],[1,1],[128,128],[1,1],128],true,true]], by r61/pfep/apply_pfeptab.py.
